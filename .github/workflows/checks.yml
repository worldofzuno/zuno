# Runs on every push and pull request, so a change that breaks the shop is
# caught here rather than on the live site.
#
# Node 20 to match netlify.toml: the functions are tested against the runtime
# they will actually run on, not whichever version the runner defaults to.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything.
permissions:
  contents: read

jobs:
  functions:
    name: Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: node --test tests/functions
        run: npm run test:functions

  browser:
    name: The shop in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # --with-deps because a bare runner has none of the libraries Chromium
      # links against. Only chromium: the shop is one page and three forms,
      # and two more engines would triple the minutes for the same answer.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: playwright test
        run: npm run test:browser

      # Only on a failure, and only then: a trace is several megabytes and
      # worth keeping exactly when something needs looking at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  headers:
    name: CSP headers are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # site/_headers pins the inline script and style by SHA-256. Edit either
      # one without regenerating the file and the browser refuses to run them:
      # the live page loads as unstyled text with a dead cart, while every
      # local check still passes. Nothing else would catch that, so this does.
      - name: Regenerate and compare
        run: |
          python3 tools/build-headers.py
          git diff --exit-code --stat site/_headers || {
            echo ""
            echo "site/_headers is stale. Run: python3 tools/build-headers.py"
            exit 1
          }
