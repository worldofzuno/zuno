<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZUNO Footer Redesign</title>
<style>
/* Tokens lifted verbatim from site/index.html, so this preview cannot
   drift from the site by using a near-miss of a brand colour. */
:root {
  color-scheme: dark;
  --black: #000000;
  --gold: #f8d99b;
  --ink: #eae4d6;
  --ink-dim: rgba(234, 228, 214, 0.63);
  --line: rgba(234, 228, 214, 0.12);
  --rail: 1180px;
  --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
  --control: 200ms;
}
/*FONTS*/
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--black);
  color: var(--ink);
  font-family: 'Archivo', ui-sans-serif, system-ui, 'Helvetica Neue', Arial, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
#vanta-bg {
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity 900ms var(--ease-premium);
  contain: layout paint;
}
#vanta-bg.is-ready { opacity: 1; }
#vanta-bg canvas { display: block; }
.rail { max-width: var(--rail); margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); }

/* ---- stand-in for the page above, so the footer is judged in context ---- */
.above {
  min-height: 62svh; display: flex; align-items: center; justify-content: center;
  text-align: center; color: rgba(234, 228, 214, 0.22);
  font-size: 0.78rem; letter-spacing: 0.24em; text-transform: uppercase;
}

/* ================= the footer ================= */
footer {
  border-top: 1px solid var(--line);
  padding: clamp(64px, 11vh, 120px) 0 clamp(32px, 5vh, 54px);
  text-align: center;
}

/* 1. the monogram */
.f__mark { margin: 0; line-height: 0; }
.f__mark img {
  height: clamp(44px, 6vw, 62px); width: auto;
  display: block; margin-inline: auto;
}

/* 2. the line that carries the footer.
   nowrap and a vw-led clamp: the size follows the viewport so the line
   always fits on one line without ever being measured against a box it
   could overflow. The upper bound stops it outgrowing the rail on a wide
   screen; the lower bound keeps it readable on a small one. */
.f__line {
  margin: clamp(26px, 4vh, 44px) 0 0;
  font-family: 'Felix Titling', Georgia, serif;
  font-weight: 400;
  font-size: clamp(1.4rem, 7vw, 5.4rem);
  line-height: 1.04;
  letter-spacing: 0.035em;
  white-space: nowrap;
  color: var(--ink);
  opacity: 0.15;
  /* The glyphs carry the letter-spacing on their right edge too, which
     pushes the optical centre left; this takes that half back. */
  text-indent: 0.035em;
}

/* 3. the separator */
.f__rule {
  width: clamp(40px, 7vw, 76px); height: 1px;
  margin: clamp(34px, 5.5vh, 60px) auto 0;
  border: 0;
  background: var(--gold);
  opacity: 0.55;
}

/* 4. the legal links */
.f__legal {
  margin: clamp(26px, 4vh, 40px) 0 0;
  padding: 0; list-style: none;
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: center;
  gap: 2px 0;
  font-size: 0.8rem;
}
.f__legal li { display: inline-flex; align-items: center; }
/* The dot is decoration between items, so it is drawn rather than typed:
   a screen reader reads three links, not three links and three dots. */
.f__legal li + li::before {
  content: "\00B7";
  color: var(--ink-dim);
  opacity: 0.5;
  margin: 0 2px;
}
/* Below this the three links no longer fit on one line, and a separator
   that lands at the start of the second line is a dot with nothing on its
   left. CSS cannot see where a line breaks, so the dots go and the gap
   does the separating instead. */
@media (max-width: 479px) {
  .f__legal li + li::before { content: none; }
  .f__legal { gap: 0 10px; }
}
.f__legal a {
  display: inline-flex; align-items: center;
  min-height: 44px; padding: 0 14px;
  color: var(--ink-dim); text-decoration: none;
  transition: color var(--control) var(--ease-premium);
}
@media (hover: hover) and (pointer: fine) {
  .f__legal a:hover { color: var(--gold); }
}
.f__legal a:focus-visible,
.f__mark a:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 4px;
  color: var(--gold);
}

/* 5. the smallest line on the page */
/* Smallest line on the page, but the step down comes from size and
   letter-spacing only. An extra opacity on top of --ink-dim took it to
   3.3:1, under what 11px text needs to be read. */
.f__copy {
  margin: clamp(18px, 3vh, 30px) 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .f__legal a { transition-duration: 1ms; }
  #vanta-bg { transition-duration: 1ms; }
}
</style>
</head>
<body>

<div id="vanta-bg" aria-hidden="true"></div>

<div class="above"><span>Preview — the page above ends here</span></div>

<footer>
  <div class="rail">

    <p class="f__mark"><img src="IMG_Z" width="179" height="200" alt="ZUNO" decoding="async"></p>

    <p class="f__line" aria-hidden="true">Not Stopping There.</p>

    <hr class="f__rule">

    <ul class="f__legal">
      <li><a href="/#legal">Legal Notice &amp; Terms</a></li>
      <li><a href="/#privacy">Privacy Policy</a></li>
      <li><a href="/#shipping">Shipping &amp; Returns</a></li>
    </ul>

    <p class="f__copy">&copy; 2026 ZUNO. All rights reserved.</p>

  </div>
</footer>

<script>/*CELLS*/</script>
<script>
(function () {
  var host = document.getElementById('vanta-bg');
  if (!host || !window.VANTA || !window.VANTA.CELLS) return;
  var fx = window.VANTA.CELLS({
    el: host, mouseControls: true, touchControls: true, gyroControls: false,
    minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00,
    color1: 0x0, color2: 0x1e3932, size: 5.00, speed: 0.00
  });
  if (!fx) return;
  host.classList.add('is-ready');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (still.matches) window.setTimeout(function () {
    if (fx.req) window.cancelAnimationFrame(fx.req);
  }, 400);
})();
</script>
</body>
</html>
